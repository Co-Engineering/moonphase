# Run the tests.
#
# Until now nothing did. Two hundred and sixty-nine tests existed and gated
# nothing: a regression could land on main and publish an image without a
# single one of them running.
#
# They run against real infrastructure rather than mocks, because that is what
# they are for — a mock of tmux, SSH or git agrees with whatever the author
# assumed, and the bugs this project actually hits are the ones where the real
# thing disagrees. So CI brings up Postgres and GoTrue, and uses the Docker
# daemon the runner already has.
#
# Callable, so the publish workflow can require it rather than duplicating it.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - "**/*.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the calling workflow as well as the ref. Without that, the run
# triggered by a push and the identical run called by the publish workflow share
# a group on the same ref and cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # The port the tests default to, so nothing has to be configured.
        ports: ["54722:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: apps/api
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: .venv/bin/ruff check moonphase/ tests/

      # The roles and auth.uid() the policies are written against. The same
      # file the compose stack uses, so CI cannot drift from what people deploy.
      - name: Bootstrap the schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54722 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f docker/bootstrap.sql

      # GoTrue owns auth.users, which the first migration puts a trigger on.
      #
      # Run here rather than as a service container for two reasons: a service
      # starts before anything else and raced Postgres into a fatal error, and
      # unlike compose, GitHub does not restart one that has died — so it
      # stayed dead and auth.users never appeared. As a step it can be ordered
      # after the bootstrap and after the database is genuinely accepting
      # connections.
      - name: Start GoTrue and wait for auth.users
        env:
          PGPASSWORD: postgres
        run: |
          docker run -d --name gotrue --network host \
            -e GOTRUE_API_HOST=0.0.0.0 \
            -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://localhost:9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e "GOTRUE_DB_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:54722/postgres?search_path=auth&sslmode=disable" \
            -e GOTRUE_SITE_URL=http://localhost:9999 \
            -e GOTRUE_JWT_SECRET=test-jwt-secret-at-least-32-characters-long \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            supabase/gotrue:v2.177.0

          for _ in $(seq 1 60); do
            found=$(psql -h 127.0.0.1 -p 54722 -U postgres -d postgres -tAc \
              "select to_regclass('auth.users') is not null")
            [ "$found" = "t" ] && break
            sleep 2
          done
          if [ "$found" != "t" ]; then
            echo "auth.users never appeared. GoTrue said:"
            docker logs gotrue
            exit 1
          fi

      - name: Migrate
        env:
          PGPASSWORD: postgres
        run: |
          for file in supabase/migrations/*.sql; do
            echo "  $(basename "$file")"
            psql -h 127.0.0.1 -p 54722 -U postgres -d postgres \
              --single-transaction -v ON_ERROR_STOP=1 -q -f "$file"
          done

      # The end-to-end test needs a throwaway sshd with the host's Docker
      # socket, which is how it exercises SSH, containers and tmux for real.
      - name: Build the test server image
        run: docker build -q -t moonphase/fake-server:latest infra/testing/fake-server/

      - name: Test
        working-directory: apps/api
        run: .venv/bin/python -m pytest tests/ -q --durations=10

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: apps/web
        run: npx eslint src --max-warnings=0

      - name: Test
        working-directory: apps/web
        run: npx vitest run

      # A build failure is a real failure — the API serves this directory, and
      # an app that typechecks but will not bundle is still a broken release.
      - name: Build
        working-directory: apps/web
        run: npx vite build
