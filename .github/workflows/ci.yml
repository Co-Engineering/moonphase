# Run the tests.
#
# Until now nothing did. Two hundred and sixty-nine tests existed and gated
# nothing: a regression could land on main and publish an image without a
# single one of them running.
#
# They run against real infrastructure rather than mocks, because that is what
# they are for — a mock of tmux, SSH or git agrees with whatever the author
# assumed, and the bugs this project actually hits are the ones where the real
# thing disagrees. So CI brings up Postgres and GoTrue, and uses the Docker
# daemon the runner already has.
#
# Callable, so the publish workflow can require it rather than duplicating it.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - "**/*.md"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # The port the tests default to, so nothing has to be configured.
        ports: ["54722:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      auth:
        image: supabase/gotrue:v2.177.0
        env:
          GOTRUE_API_HOST: 0.0.0.0
          GOTRUE_API_PORT: "9999"
          API_EXTERNAL_URL: http://localhost:9999
          GOTRUE_DB_DRIVER: postgres
          GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth&sslmode=disable
          GOTRUE_SITE_URL: http://localhost:9999
          GOTRUE_JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          GOTRUE_JWT_AUD: authenticated
          GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
          GOTRUE_MAILER_AUTOCONFIRM: "true"
        ports: ["9999:9999"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: apps/api
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: .venv/bin/ruff check moonphase/ tests/

      # The schema the policies are written against. Same file the compose
      # stack uses, so CI cannot drift from what people actually deploy.
      #
      # GoTrue is pointed at search_path=auth and will not create that schema
      # itself, so this has to happen before it manages its own migrations —
      # it retries on failure, which is what makes the ordering survivable.
      - name: Bootstrap the schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54722 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f docker/bootstrap.sql

          echo "waiting for GoTrue to create auth.users"
          for _ in $(seq 1 60); do
            found=$(psql -h 127.0.0.1 -p 54722 -U postgres -d postgres -tAc \
              "select to_regclass('auth.users') is not null")
            [ "$found" = "t" ] && break
            sleep 2
          done
          [ "$found" = "t" ] || { echo "auth.users never appeared"; exit 1; }

          for file in supabase/migrations/*.sql; do
            echo "  $(basename "$file")"
            psql -h 127.0.0.1 -p 54722 -U postgres -d postgres \
              --single-transaction -v ON_ERROR_STOP=1 -q -f "$file"
          done

      # The end-to-end test needs a throwaway sshd with the host's Docker
      # socket, which is how it exercises SSH, containers and tmux for real.
      - name: Build the test server image
        run: docker build -q -t moonphase/fake-server:latest infra/testing/fake-server/

      - name: Test
        working-directory: apps/api
        run: .venv/bin/python -m pytest tests/ -q --durations=10

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: apps/web
        run: npx eslint src --max-warnings=0

      - name: Test
        working-directory: apps/web
        run: npx vitest run

      # A build failure is a real failure — the API serves this directory, and
      # an app that typechecks but will not bundle is still a broken release.
      - name: Build
        working-directory: apps/web
        run: npx vite build
