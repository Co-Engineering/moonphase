# Publish the Moonphase image.
#
# One image: the control plane, containing the API and the client it serves.
# The images your *projects* run in are built on the managed server from a
# recipe, so there is nothing to publish for those.
#
# Two registries. GitHub's is the default because it needs no credentials —
# GITHUB_TOKEN is issued to the run — and because it does not rate-limit
# anonymous pulls, which matters for something people pull onto their own
# servers and CI runners. Docker Hub is a mirror for the shorter name, and is
# skipped rather than failing when its token is not configured.
#
# Pull requests build without pushing, so a change that breaks the image fails
# in review rather than after merge.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is published that the tests have not passed on. Reused rather than
  # duplicated, so the gate and the CI everyone reads are the same thing.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Whether to mirror to Docker Hub. Decided in a step rather than an `if:`
      # on the secret directly, because that is the form that behaves the same
      # way on forks, where no secret exists at all.
      - id: hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub token not set — publishing to ghcr.io only." >> "$GITHUB_STEP_SUMMARY"
          fi

      # arm64 matters more than usual here: a lot of the machines people
      # self-host on are ARM, and so is every recent Mac.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=oliversvanecoec/moonphase,enable=${{ steps.hub.outputs.enabled }}
          # A tag v0.2.1 publishes 0.2.1, 0.2 and latest, so someone can pin as
          # loosely or as tightly as they like. main publishes `edge` only —
          # `latest` should mean a release, not the last commit that built.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Moonphase
            org.opencontainers.image.description=Self-hosted control plane for remote AI coding sessions
            org.opencontainers.image.licenses=SEE LICENSE IN LICENSE

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache keeps a rebuild from redoing the pnpm install and
          # the pip install every time, which is most of the build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Docker Hub shows a repository's README from its own field rather than
      # from git, so it stays empty unless it is pushed explicitly.
      - name: Update the Docker Hub description
        if: steps.hub.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: oliversvanecoec/moonphase
          short-description: Self-hosted control plane for remote AI coding sessions
          readme-filepath: ./docker/README.md
