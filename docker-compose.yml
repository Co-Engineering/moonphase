# Moonphase, self-hosted.
#
#   ./scripts/install.sh
#
# Four containers. Postgres holds everything, GoTrue handles sign-in, the API
# does the work, and Caddy puts all of it on one address — which is what lets a
# phone connect by typing a single URL.
#
# Deliberately not the full Supabase stack. Moonphase talks to Postgres with
# asyncpg and never goes through PostgREST, Realtime or Storage, so running
# them would be several hundred megabytes of container doing nothing. See
# docker/bootstrap.sql for the small surface it does depend on.

name: moonphase

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, when the cluster is first created — which is before GoTrue
      # ever connects. GoTrue is pointed at `search_path=auth` and will not
      # create that schema itself, so without this it fails its own migrations
      # with "no schema has been selected to create in". Real Supabase gets the
      # schema from its Postgres image; this is the equivalent.
      - ./docker/bootstrap.sql:/docker-entrypoint-initdb.d/00-moonphase.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default. Nothing outside this network needs it, and a
    # Postgres on a public interface is how self-hosted things get owned.
    # Uncomment to inspect it with psql from the host.
    # ports:
    #   - "127.0.0.1:54322:5432"

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${MOONPHASE_PUBLIC_URL:-http://localhost:8471}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: ${MOONPHASE_PUBLIC_URL:-http://localhost:8471}
      GOTRUE_URI_ALLOW_LIST: ${MOONPHASE_PUBLIC_URL:-*}
      # HS256 with a shared secret. The API accepts both this and asymmetric
      # tokens over JWKS; the shared secret keeps the stack to two services.
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET in .env}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Self-hosted and single-tenant: you are the only one signing up, and
      # there is no mail server. Turn confirmation on once you have one.
      GOTRUE_DISABLE_SIGNUP: ${MOONPHASE_DISABLE_SIGNUP:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${MOONPHASE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_LOG_LEVEL: warn
    # Sign-in methods are configured in the setup screen and written here by the
    # API. The entrypoint reloads when that file changes, so turning on Google
    # does not mean editing anything on the server.
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./docker/auth-entrypoint.sh:/entrypoint.sh:ro
      - auth-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot. Creates the roles and `auth.uid()` that the policies are written
  # against, then applies every migration that has not run yet.
  migrate:
    # The same image as the API, because that is what carries the migrations.
    # They used to be mounted from a checkout on the server, which meant
    # `docker compose pull` upgraded the code and left the schema behind —
    # and said nothing, because a migration that is not there is not a
    # migration that failed.
    image: ${MOONPHASE_IMAGE:-ghcr.io/oliversvane/moonphase}:${MOONPHASE_VERSION:-edge}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      MIGRATIONS_DIR: /app/migrations
      BOOTSTRAP: /app/bootstrap.sql
    entrypoint: ["sh", "/app/migrate.sh"]
    restart: "no"

  api:
    # Published by .github/workflows/docker.yml. Pulling is the default because
    # it is a minute rather than several, and because everyone then runs the
    # same bits — a local build depends on the builder's Docker, cache and
    # architecture.
    #
    # ghcr.io rather than Docker Hub by default: it does not rate-limit
    # anonymous pulls, and Docker Hub's 100-per-6-hours-per-IP limit surfaces
    # mid-install as a confusing "toomanyrequests" on shared addresses and CI.
    # Set MOONPHASE_IMAGE=oliversvanecoec/moonphase to use the mirror instead.
    #
    # To run from source, add the override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${MOONPHASE_IMAGE:-ghcr.io/oliversvane/moonphase}:${MOONPHASE_VERSION:-edge}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      # The public address, because it is what the browser must be able to
      # reach — the client is served from here and signs in against the same
      # origin.
      SUPABASE_URL: ${MOONPHASE_PUBLIC_URL:-http://localhost:8471}
      # GoTrue directly, for the admin calls that manage accounts. The proxy in
      # front of it serves browsers; two containers on one network do not need
      # to go out and back to talk to each other.
      MOONPHASE_AUTH_URL: http://auth:9999
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      MOONPHASE_SECRET_KEY: ${MOONPHASE_SECRET_KEY:?set MOONPHASE_SECRET_KEY in .env}
      MOONPHASE_API_HOST: 0.0.0.0
      MOONPHASE_API_PORT: "8471"
      # Same origin through the proxy, so there is nothing to allow.
      MOONPHASE_CORS_ORIGINS: ${MOONPHASE_PUBLIC_URL:-http://localhost:8471}

      MOONPHASE_RUNTIME_IMAGE: ${MOONPHASE_RUNTIME_IMAGE:-moonphase/runtime-claude:latest}
      MOONPHASE_SSH_TRUST_ON_FIRST_USE: ${MOONPHASE_SSH_TRUST_ON_FIRST_USE:-true}
      MOONPHASE_MONITOR_INTERVAL: ${MOONPHASE_MONITOR_INTERVAL:-20}

      MOONPHASE_VAPID_PUBLIC_KEY: ${MOONPHASE_VAPID_PUBLIC_KEY:-}
      MOONPHASE_VAPID_PRIVATE_KEY: ${MOONPHASE_VAPID_PRIVATE_KEY:-}
      MOONPHASE_VAPID_SUBJECT: ${MOONPHASE_VAPID_SUBJECT:-mailto:admin@example.com}
      MOONPHASE_GITHUB_CLIENT_ID: ${MOONPHASE_GITHUB_CLIENT_ID:-}

      # Preview listeners live in this container, so they bind to all of its
      # interfaces and are reached at the public host. Nothing on the host is
      # exposed by this; only the proxy publishes ports.
      MOONPHASE_PREVIEW_BIND: 0.0.0.0
      MOONPHASE_PREVIEW_HOST: ${MOONPHASE_PREVIEW_HOST:-127.0.0.1}
    volumes:
      # Managed SSH keys are encrypted in the database, but asyncssh writes
      # known_hosts and control files; give it somewhere durable.
      - api-state:/home/moonphase/.moonphase
      # Where the generated auth configuration is written. Shared with the auth
      # container, which reloads when it changes.
      - auth-config:/config

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - auth
    ports:
      # Only the plain port here. 80 and 443 are added by
      # docker-compose.public.yml, which the installer applies when they are
      # free — publishing them unconditionally meant Moonphase could not be
      # installed on any machine already running a web server.
      - "${MOONPHASE_BIND:-127.0.0.1}:${MOONPHASE_PORT:-8471}:8471"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  auth-config:
  api-state:
  caddy-data:
  caddy-config:
