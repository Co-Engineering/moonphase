# tmux configuration for Moonphase project containers.
#
# Tuned for one thing: being attached to by a browser terminal, detached
# abruptly when a laptop lid closes, and reattached hours later from a phone.

# The harness draws a full-colour TUI; without this it degrades to 8 colours.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:Tc"

# Deep scrollback so reattaching after a long break still shows the work.
set  -g  history-limit 50000

# Never tear a session down on its own. Moonphase decides when a session ends.
set  -g  destroy-unattached off
set  -g  exit-empty off
set  -g  remain-on-exit off

# Resize to the smallest *currently attached* client rather than the smallest
# that ever attached, so a phone attaching briefly does not permanently shrink
# the desktop's view.
setw -g  aggressive-resize on

# Escape must reach the TUI immediately — the default delay makes the harness
# feel broken when you press Esc to interrupt.
set  -s  escape-time 0

set  -g  focus-events on
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1

# The harness's own clipboard-copy has no real OS clipboard to write to in
# here (no X server, no Wayland), so it falls back to an OSC 52 escape
# sequence wrapped in tmux's DCS passthrough — the standard way to get a
# clipboard write through tmux to whatever the outer terminal is (the
# browser's xterm, which already has an OSC 52 handler — see Terminal.tsx).
# tmux has blocked that passthrough format by default since 3.3; without
# this, the sequence is silently dropped and copying inside the harness does
# nothing, with no error to say so.
set  -g  allow-passthrough on

# A quiet status bar. The Moonphase UI already shows project and server, so
# this only carries what tmux itself knows.
set  -g  status-style "bg=#1a1b26,fg=#a9b1d6"
set  -g  status-left  " #[bold]moonphase#[default] "
set  -g  status-right " #{session_name} · %H:%M "
set  -g  status-left-length 30
